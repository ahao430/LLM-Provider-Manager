<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>LCM — Local Channel Manager</title>
    <style>
      /* 启动 splash：WebView 加载到 React 挂载之间的白屏期占位（随系统深浅色） */
      html, body { margin: 0; height: 100%; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: #fafafa; color: #18181b;
        font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
        user-select: none;
      }
      #splash .logo {
        width: 44px; height: 44px; border-radius: 10px;
        background: #18181b; color: #fafafa;
        display: flex; align-items: center; justify-content: center;
        font-size: 20px; font-weight: 700;
      }
      #splash .ring {
        width: 22px; height: 22px; border-radius: 50%;
        border: 2px solid rgba(0, 0, 0, 0.12);
        border-top-color: #3b82f6;
        animation: splash-spin 0.8s linear infinite;
      }
      #splash .text { font-size: 13px; color: #71717a; letter-spacing: 0.05em; }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        #splash { background: #09090b; color: #fafafa; }
        #splash .logo { background: #fafafa; color: #09090b; }
        #splash .ring { border-color: rgba(255, 255, 255, 0.15); border-top-color: #3b82f6; }
        #splash .text { color: #a1a1aa; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="logo">L</div>
      <div class="ring"></div>
      <div class="text">LCM 加载中…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
