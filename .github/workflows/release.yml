name: Release

# 推送 v* 标签触发三平台构建；构建期间保持草稿，全部平台成功后由 publish job 自动发布。
# 任一平台失败则草稿保留、不发布（避免半成品 Release 上线）。
# 版本号来自 src-tauri/tauri.conf.json（由 pnpm version:sync 统一同步）。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            mcp-target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
            mcp-target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: x86_64-unknown-linux-gnu
            mcp-target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ""
            rust-targets: x86_64-pc-windows-msvc
            mcp-target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 版本从 package.json 的 packageManager 读取，不在此重复指定
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 应用内更新签名（minisign）：注入私钥后 tauri-action 自动生成 .sig 与 latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "LCM v__VERSION__"
          releaseBody: "见 Assets 下载对应平台的安装包。变更说明请查看 CHANGELOG.md。"
          releaseDraft: true
          prerelease: false
          # 各平台矩阵 job 把签名信息合并进 release 的 latest.json（updater 清单）
          includeUpdaterJson: true
          updaterJsonPreferTrueUrl: true
          args: ${{ matrix.args }}

      # 附赠只读 MCP 服务器二进制（设置页「MCP」卡片指引注册）
      - name: Build lcm-mcp
        shell: bash
        run: cargo build --release --bin lcm-mcp --target ${{ matrix.mcp-target }}
        working-directory: src-tauri

      - name: Upload lcm-mcp to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r '.version' src-tauri/tauri.conf.json)
          ext=""
          if [[ "${{ matrix.mcp-target }}" == *"windows"* ]]; then ext=".exe"; fi
          src="src-tauri/target/${{ matrix.mcp-target }}/release/lcm-mcp${ext}"
          asset="lcm-mcp-${{ matrix.mcp-target }}${ext}"
          cp "$src" "$asset"
          gh release upload "v${version}" "$asset" --clobber

  # 全部平台构建成功后自动发布草稿（推 tag → 出包 → 自动上线，无需手动点发布）
  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify updater assets before publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r '.version' src-tauri/tauri.conf.json)
          tag="v${version}"
          echo "校验 ${tag} 的更新链路资产（防多矩阵上传竞态；GitHub API 资产列表有最终一致性延迟，重试容忍）..."
          missing_report() {
            local assets="$1" missing=0
            echo "$assets" | grep -qx "latest.json" || { echo "❌ 缺少资产: latest.json"; missing=1; }
            # 各平台 updater 签名（tauri-action 在注入私钥时生成）
            for pat in "aarch64.app.tar.gz.sig" "x64.app.tar.gz.sig" "setup.exe.sig" "AppImage.sig"; do
              echo "$assets" | grep -q "$pat" || { echo "❌ 缺少签名产物（匹配: $pat）"; missing=1; }
            done
            return $missing
          }
          ok=0
          for i in 1 2 3 4 5 6; do
            assets=$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null) || assets=""
            if missing_report "$assets"; then ok=1; break; fi
            echo "（第 $i 次校验缺资产，5 秒后重试——可能是 API 资产列表延迟）"
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::重试后仍缺资产（多矩阵上传竞态或 API 延迟）。草稿已保留：Re-run failed jobs 补齐资产后再发布。"
            exit 1
          fi
          echo "✅ 资产齐全"

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r '.version' src-tauri/tauri.conf.json)
          gh release edit "v${version}" --draft=false
          echo "已发布 v${version}"
